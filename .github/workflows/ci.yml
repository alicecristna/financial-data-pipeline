name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pandas: "pandas>=2.2,<3"
          - python-version: "3.11"
            pandas: "pandas>=3,<4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Pin pandas line under test
        run: python -m pip install "${{ matrix.pandas }}"
      - name: Run offline test suite
        run: python -m pytest
      - name: Run offline demo
        run: python demo.py
